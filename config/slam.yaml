slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    # base_frame/odom_frame match the sentry URDF's root link and the
    # OdometryPublisher plugin's frames (see sim/urdf/sentry.urdf.xacro),
    # so this works unmodified against the sim package's odom->root TF.
    odom_frame: odom
    map_frame: map
    base_frame: root
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.15 # matches RPLIDAR A2M8 min range
    max_laser_range: 12.0 # matches RPLIDAR A2M8 max range
    minimum_time_interval: 0.5
    transform_timeout: 1.0 # was 0.2: too tight for the current TF tree (12
                           # frames, including the suspension chain), which
                           # was causing every scan to get dropped
                           # ("message filter queue full") even though the
                           # transforms themselves were fine, just not
                           # ready within the old tolerance
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Was 0.5/0.5 (rad). 0.5m is far too coarse for this robot: sudden
    # external position jerks (wheel slip on the arena's "Bumpy Road"
    # zone, bumps/collisions -- see sim/sim/pose_emulator.py's
    # trigger_jerk, added to model exactly this) are, by construction,
    # invisible to wheel odometry (that's the whole point of needing SLAM
    # correction) -- so if the robot is stationary or moving slowly when
    # one happens, "distance traveled since the last processed scan" (as
    # measured off reported /odom, which the jerk deliberately leaves
    # unchanged) never crosses a 0.5m threshold, and slam_toolbox never
    # even attempts a new scan match to notice the discrepancy: map->odom
    # stays frozen indefinitely. Verified live in sim: a trigger_jerk call
    # with the robot stationary produced no map->odom update at all over
    # a 30s window at the old 0.5 value; driving the robot for real
    # (actual /cmd_vel motion, not a jerk) did update map->odom normally,
    # confirming the scan-matching pipeline itself was never the problem,
    # just this gate. 0.1m (2 resolution cells) still limits scan-matching
    # frequency/cost sensibly but lets slam_toolbox react promptly to a
    # jerk even with little or no real motion since the last scan.
    # minimum_travel_heading is irrelevant either way -- this chassis is
    # holonomic and never rotates its heading -- left small rather than 0
    # to avoid relying on exact-zero comparisons.
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.05
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
