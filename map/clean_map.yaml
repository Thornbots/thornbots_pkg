image: clean_map.pgm
mode: trinary
# Resolution/origin derived (not measured at capture time -- no yaml
# shipped with this image) by matching 6 wall/feature centroids against
# ARCC26's known-good yaml via least-squares fit -- see the commit message
# for the fitting method. Residual scatter across features was ~4-6cm,
# consistent with ARCC26 being a noisy real SLAM map rather than ground
# truth, not with a wrong scale/offset. Re-derive properly (or replace
# this file) if this map is ever regenerated with real yaml alongside it.
resolution: 0.02
origin: [-4.21, -6.05, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
