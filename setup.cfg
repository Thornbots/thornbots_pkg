[develop]
script_dir=$base/lib/sentry_pkg
[install]
install_scripts=$base/lib/sentry_pkg

[tool:pytest]
testpaths = test
# The pip-installed anyio in the container ships a pytest plugin
# incompatible with the apt pytest 6.2.5 and breaks collection outright
# (ModuleNotFoundError: _pytest.scope).
addopts = -p no:anyio
