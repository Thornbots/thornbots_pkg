[develop]
script_dir=$base/lib/thornbots_pkg
[install]
install_scripts=$base/lib/thornbots_pkg

[tool:pytest]
testpaths = test
# The pip-installed anyio in the container ships a pytest plugin
# incompatible with the apt pytest 6.2.5 and breaks collection outright
# (ModuleNotFoundError: _pytest.scope).
addopts = -p no:anyio
markers =
    linter: ament lint check (flake8/pep257/copyright)
    flake8: ament_flake8
    pep257: ament_pep257
    copyright: ament_copyright
